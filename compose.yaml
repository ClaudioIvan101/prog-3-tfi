name: leadqual

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Falta POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Falta POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  core-api:
    build:
      context: ./express
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:?Falta POSTGRES_DB}"
      PGUSER: "${POSTGRES_USER:?Falta POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge